name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0)'
        required: true
        default: '0.1.0'

defaults:
  run:
    shell: bash

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install WebView2
        run: |
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?linkid=2124701" -OutFile "MicrosoftEdgeWebview2Setup.exe"
          Start-Process -FilePath "MicrosoftEdgeWebview2Setup.exe" -Args "/silent /install" -Wait

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        run: npm run tauri build

      - name: List artifacts
        run: |
          ls -la src-tauri/target/release/bundle/nsis/
          ls -la src-tauri/target/release/bundle/msi/

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: omniclip-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: omniclip-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi

  release:
    name: Create Release
    needs: build-windows
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Download NSIS artifact
        uses: actions/download-artifact@v4
        with:
          name: omniclip-windows-nsis
          path: dist/nsis

      - name: Download MSI artifact
        uses: actions/download-artifact@v4
        with:
          name: omniclip-windows-msi
          path: dist/msi

      - name: Set version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: OmniClip ${{ steps.version.outputs.tag }}
          body: |
            ## OmniClip ${{ steps.version.outputs.tag }}

            ### 桌面端安装包

            - **Windows NSIS** (推荐): [下载](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/OmniClip_${{ steps.version.outputs.tag }}_x64-setup.exe)
            - **Windows MSI**: [下载](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/OmniClip_${{ steps.version.outputs.tag }}_x64_en-US.msi)

            ### 移动端

            请参考 [README.md](https://github.com/${{ github.repository }}#%E7%A7%BB%E5%8A%A8%E7%AB%AF-android) 自行构建 Android 应用。

            ### 更新日志

            - SSE (Server-Sent Events) 实时推送，PC 剪贴板变化手机端即时接收
            - HTTP API + mDNS 设备发现，局域网内自动配对
            - Flutter Android 客户端，支持实时同步、发送文本到电脑
            - 修复多个同步相关 bug
          files: |
            dist/nsis/*.exe
            dist/msi/*.msi
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
