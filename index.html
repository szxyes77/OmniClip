<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%236366f1'/%3E%3Cpath d='M10 12h12v2H10zm0 4h12v2H10zm0 4h8v2H10z' fill='white'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OmniClip</title>
    <style>
      #splash-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #f8f9fa;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        transition: opacity 0.3s ease;
      }
      #splash-screen.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .splash-logo {
        width: 64px;
        height: 64px;
        margin-bottom: 24px;
        animation: pulse 2s ease-in-out infinite;
      }
      .splash-text {
        font-size: 18px;
        font-weight: 500;
        color: #4a5568;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.8; }
      }
    </style>
  </head>
  <body class="bg-surface-light dark:bg-surface-dark text-gray-900 dark:text-gray-100">
    <div id="root"></div>
    <div id="splash-screen">
      <svg class="splash-logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <rect width="64" height="64" rx="12" fill="#6366f1"/>
        <path d="M18 24h28v4H18zm0 6h28v4H18zm0 6h18v4H18z" fill="white"/>
      </svg>
      <div class="splash-text">正在初始化...</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
